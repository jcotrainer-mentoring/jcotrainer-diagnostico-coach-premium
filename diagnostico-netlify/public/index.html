<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico Coach Premium — JCOTRAINER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --white:#FFFFFF;
    --blue:#00B0F0;
    --yellow:#FFC000;
    --panel:#0d0d0d;
    --panel-2:#151515;
    --gray:#8a8a8a;
    --track:#1f1f1f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--black); color:var(--white); font-family:'Lato',sans-serif; font-weight:300;}
  body{min-height:100vh; display:flex; justify-content:center;}
  #app{width:100%; max-width:540px; min-height:100vh; position:relative; display:flex; flex-direction:column; padding:24px 20px 60px;}

  .wordmark{font-family:'Lato',sans-serif; font-weight:900; font-size:15px; letter-spacing:-0.02em;}
  .wordmark .jco{color:var(--white);}
  .wordmark .trainer{color:var(--blue);}
  header.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .pulse-wrap{position:fixed; inset:0; overflow:hidden; z-index:-1; pointer-events:none;}
  .pulse-line{position:absolute; top:18%; left:-10%; width:120%; opacity:0.08;}

  /* Progress */
  .progress-track{width:100%; height:3px; background:var(--track); border-radius:2px; margin:22px 0 30px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--blue); border-radius:2px; transition:width .35s ease;}

  /* Screens */
  .screen{flex:1; display:flex; flex-direction:column; animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* Welcome */
  .eyebrow{color:var(--blue); font-weight:700; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px;}
  h1{font-weight:900; font-size:32px; line-height:1.08; letter-spacing:-0.01em; margin-bottom:14px;}
  h1 .accent{color:var(--blue);}
  .sub{color:#c7c7c7; font-weight:300; font-size:15.5px; line-height:1.55; margin-bottom:28px;}
  .meta-line{display:flex; gap:18px; margin-bottom:34px; flex-wrap:wrap;}
  .meta-item{font-size:12.5px; color:var(--gray); font-weight:700; text-transform:uppercase; letter-spacing:0.04em;}
  .meta-item b{color:var(--white); font-weight:900; display:block; font-size:20px; letter-spacing:-0.02em;}

  .btn-primary{background:var(--blue); color:var(--black); border:none; font-family:'Lato'; font-weight:900; font-size:15px; text-transform:uppercase; letter-spacing:0.03em; padding:17px 22px; border-radius:2px; cursor:pointer; width:100%; transition:transform .15s ease, background .15s ease;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{background:var(--track); color:#666; cursor:not-allowed;}
  .btn-secondary{background:transparent; color:var(--white); border:1px solid #333; font-family:'Lato'; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.03em; padding:14px 18px; border-radius:2px; cursor:pointer; width:100%;}

  .nav-row{display:flex; gap:10px; margin-top:28px;}
  .nav-row .btn-secondary{flex:0 0 84px;}

  /* Questions */
  .q-count{color:var(--gray); font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px;}
  .q-pillar{color:var(--blue); font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:16px;}
  .q-text{font-weight:900; font-size:22px; line-height:1.28; margin-bottom:26px; letter-spacing:-0.005em;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .option{background:var(--panel); border:1px solid #262626; border-radius:2px; padding:16px 16px; cursor:pointer; font-size:14.5px; font-weight:400; color:#e6e6e6; transition:border-color .15s ease, background .15s ease;}
  .option:hover{border-color:#3a3a3a;}
  .option.selected{border-color:var(--blue); background:#061722; color:var(--white); font-weight:700;}

  /* Loading */
  .loading-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  .pulse-bar{width:220px; height:2px; background:var(--track); position:relative; overflow:hidden; margin:26px 0;}
  .pulse-bar::after{content:''; position:absolute; top:0; left:-40%; width:40%; height:100%; background:var(--blue); animation:slide 1.1s ease-in-out infinite;}
  @keyframes slide{0%{left:-40%;} 50%{left:100%;} 100%{left:100%;}}
  .loading-title{font-weight:900; font-size:18px; letter-spacing:-0.01em;}
  .loading-sub{color:var(--gray); font-size:13px; margin-top:8px;}

  /* Results */
  .badge{display:inline-flex; align-items:center; gap:8px; background:var(--yellow); color:var(--black); font-weight:900; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; padding:7px 14px; border-radius:2px; margin-bottom:18px;}
  .score-row{display:flex; align-items:baseline; gap:10px; margin-bottom:6px;}
  .score-num{font-weight:900; font-size:56px; color:var(--yellow); line-height:1; letter-spacing:-0.02em;}
  .score-max{color:var(--gray); font-size:16px; font-weight:700;}
  .score-label{color:var(--gray); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:30px;}

  .pillars{display:flex; flex-direction:column; gap:16px; margin-bottom:34px;}
  .pillar-row .pillar-top{display:flex; justify-content:space-between; margin-bottom:7px;}
  .pillar-name{font-size:12.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; color:#d8d8d8;}
  .pillar-val{font-size:12.5px; font-weight:900; color:var(--blue);}
  .pillar-track{width:100%; height:6px; background:var(--track); border-radius:3px; overflow:hidden;}
  .pillar-fill{height:100%; background:var(--blue); border-radius:3px; transition:width .8s ease;}

  .section-label{color:var(--blue); font-size:11.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:10px; margin-top:6px;}
  .diagnostico-text{font-size:15px; line-height:1.6; color:#ededed; font-weight:300; margin-bottom:26px;}

  .brecha-box{border-left:2px solid var(--yellow); padding:4px 0 4px 16px; margin-bottom:28px;}
  .brecha-box p{font-size:14.5px; line-height:1.6; color:#e0e0e0; font-weight:300;}

  .modulo-card{background:var(--panel-2); border:1px solid #262626; border-radius:2px; padding:20px; margin-bottom:28px;}
  .modulo-eyebrow{color:var(--gray); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;}
  .modulo-name{font-weight:900; font-size:19px; color:var(--white); margin-bottom:10px; letter-spacing:-0.01em;}
  .modulo-why{font-size:14px; line-height:1.55; color:#c7c7c7; font-weight:300;}

  .steps{list-style:none; counter-reset:step; margin-bottom:36px;}
  .steps li{counter-increment:step; display:flex; gap:14px; padding:14px 0; border-top:1px solid #1e1e1e;}
  .steps li:last-child{border-bottom:1px solid #1e1e1e;}
  .steps li::before{content:counter(step); flex:0 0 26px; height:26px; border:1px solid var(--blue); color:var(--blue); font-weight:900; font-size:12px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
  .step-text{font-size:14.5px; line-height:1.55; color:#e6e6e6; font-weight:400; padding-top:2px;}

  .error-box{border:1px solid #3a1a1a; background:#160707; padding:18px; border-radius:2px; margin-bottom:20px;}
  .error-box p{font-size:13.5px; color:#ff9a9a; line-height:1.5;}

  footer.foot{margin-top:auto; padding-top:30px; text-align:center;}
  footer.foot .wordmark{justify-content:center; display:inline-flex; opacity:0.5; cursor:default;}

  .input-field{width:100%; background:var(--panel); border:1px solid #262626; color:var(--white); font-family:'Lato',sans-serif; font-weight:400; font-size:14.5px; padding:15px 16px; border-radius:2px; margin-bottom:22px; outline:none;}
  .input-field:focus{border-color:var(--blue);}
  .input-field::placeholder{color:#666;}

  .pin-input{width:100%; background:var(--panel); border:1px solid #262626; color:var(--white); font-family:'Lato',sans-serif; font-weight:900; font-size:28px; letter-spacing:0.5em; text-align:center; padding:18px 16px 18px 22px; border-radius:2px; margin-bottom:16px; outline:none;}
  .pin-input:focus{border-color:var(--blue);}
  .pin-input.pin-error{border-color:#ff4d4d;}
  .pin-error-text{color:#ff9a9a; font-size:12.5px; text-align:center; margin-bottom:22px; font-weight:700;}

  /* Coach panel */
  .coach-exit{width:auto !important; padding:8px 14px !important; font-size:11px !important;}
  .coach-list{list-style:none;}
  .coach-entry{padding:12px 0; border-top:1px solid #1e1e1e;}
  .coach-entry:last-child{border-bottom:1px solid #1e1e1e;}
  .coach-row{display:flex; justify-content:space-between; gap:10px;}
  .coach-name{font-weight:700; font-size:14px; color:var(--white);}
  .coach-score{color:var(--blue); font-weight:900; font-size:14px; flex:0 0 auto;}
  .coach-meta{color:var(--gray); font-size:12px; margin-top:4px;}

  @media (max-width:400px){
    h1{font-size:27px;}
    .score-num{font-size:46px;}
  }
</style>
</head>
<body>
<div class="pulse-wrap">
  <svg class="pulse-line" viewBox="0 0 800 100" preserveAspectRatio="none">
    <polyline points="0,60 100,60 130,20 160,90 190,60 800,60" fill="none" stroke="#00B0F0" stroke-width="2"/>
  </svg>
</div>
<div id="app"></div>

<script>
const QUESTIONS = [
  {
    pillar: "FUNDAMENTOS",
    text: "¿Cuántas horas a la semana dedicas a tareas de negocio (no a entrenar clientes)?",
    options: [
      {label:"0–1 horas", value:0},
      {label:"2–4 horas", value:1},
      {label:"5–8 horas", value:2},
      {label:"Más de 8 horas", value:3},
    ]
  },
  {
    pillar: "FUNDAMENTOS",
    text: "¿Llevas control de tus números de negocio (ingresos, clientes activos, retención)?",
    options: [
      {label:"No llevo ningún control", value:0},
      {label:"Lo tengo en la cabeza, sin registro", value:1},
      {label:"Hoja de cálculo básica", value:2},
      {label:"Sistema o dashboard definido", value:3},
    ]
  },
  {
    pillar: "MARCA",
    text: "¿Tienes un nicho o especialidad clara dentro del entrenamiento?",
    options: [
      {label:"Entreno de todo un poco", value:0},
      {label:"Tengo una idea, pero no la comunico", value:1},
      {label:"Nicho definido, poco visible", value:2},
      {label:"Nicho definido y visible en mi bio/redes", value:3},
    ]
  },
  {
    pillar: "MARCA",
    text: "¿Cómo describirías tu presencia en redes sociales o perfil profesional?",
    options: [
      {label:"No tengo o está desactualizado", value:0},
      {label:"Básico, sin estrategia", value:1},
      {label:"Activo, pero sin propuesta de valor clara", value:2},
      {label:"Activo, con propuesta de valor y casos concretos", value:3},
    ]
  },
  {
    pillar: "OFERTA",
    text: "¿Cómo cobras a tus clientes actualmente?",
    options: [
      {label:"Por sesión suelta", value:0},
      {label:"Paquetes de sesiones sin objetivo definido", value:1},
      {label:"Paquetes con objetivo, precio variable", value:2},
      {label:"Programa premium: precio fijo y resultado definido", value:3},
    ]
  },
  {
    pillar: "OFERTA",
    text: "Comparado con el mercado de tu zona, tu tarifa está...",
    options: [
      {label:"Claramente por debajo", value:0},
      {label:"En el promedio", value:1},
      {label:"Ligeramente por encima", value:2},
      {label:"Claramente premium, por encima del mercado", value:3},
    ]
  },
  {
    pillar: "VENTAS",
    text: "¿Cómo consigues la mayoría de tus clientes hoy?",
    options: [
      {label:"Espero a que lleguen / boca a boca pasivo", value:0},
      {label:"Prospección informal, sin guion", value:1},
      {label:"Prospección con estrategia, pero inconsistente", value:2},
      {label:"Sistema de captación activo y constante", value:3},
    ]
  },
  {
    pillar: "VENTAS",
    text: "¿Con qué frecuencia pierdes clientes en sus primeros 3 meses?",
    options: [
      {label:"Frecuentemente, sin saber bien por qué", value:0},
      {label:"A veces, sin proceso de retención", value:1},
      {label:"Rara vez, tengo algo de seguimiento", value:2},
      {label:"Casi nunca, tengo proceso de retención definido", value:3},
    ]
  },
  {
    pillar: "BOTTLENECK",
    text: "Hoy, tu mayor cuello de botella es...",
    options: [
      {label:"Captar clientes nuevos", value:"captación de clientes nuevos"},
      {label:"Cerrar ventas / objeciones de precio", value:"cierre de ventas y manejo de objeciones de precio"},
      {label:"Retener a los clientes actuales", value:"retención de clientes actuales"},
      {label:"Subir tarifas sin perder clientes", value:"subir tarifas sin perder clientes"},
      {label:"Organizar mi tiempo y mi negocio", value:"organización del tiempo y del negocio"},
    ]
  }
];

const MODULOS = [
  "Diagnóstico y fundamentos",
  "Marca personal",
  "Oferta y precios premium",
  "Ventas y retención",
  "Plan de acción"
];

const COACH_PIN = "2580";

let state = { screen:'welcome', current:0, answers:new Array(QUESTIONS.length).fill(null), result:null, error:null, userName:'', coachData:null, coachLoading:false, pinError:false, exportSent:false };
let tapCount = 0;
let tapTimer = null;

function render(){
  const app = document.getElementById('app');
  if(state.screen==='welcome') app.innerHTML = renderWelcome();
  else if(state.screen==='question') app.innerHTML = renderQuestion();
  else if(state.screen==='loading') app.innerHTML = renderLoading();
  else if(state.screen==='result') app.innerHTML = renderResult();
  else if(state.screen==='pin') app.innerHTML = renderPin();
  else if(state.screen==='coach') app.innerHTML = renderCoach();
  attachHandlers();
}

function wordmark(){
  return `<div class="wordmark"><span class="jco">JCO</span><span class="trainer">TRAINER</span></div>`;
}

function renderWelcome(){
  return `
    <header class="top">${wordmark()}</header>
    <div class="screen" style="justify-content:center; flex:1;">
      <div class="eyebrow">Taller: De Entrenador a Coach Premium</div>
      <h1>Diagnóstico<br><span class="accent">Coach Premium</span></h1>
      <p class="sub">9 preguntas sobre cómo operas tu negocio hoy. Al final recibes tu nivel actual, tu brecha hacia el modelo premium y el módulo del taller por donde empezar.</p>
      <div class="meta-line">
        <div class="meta-item"><b>9</b>Preguntas</div>
        <div class="meta-item"><b>~2 min</b>Duración</div>
        <div class="meta-item"><b>4</b>Pilares evaluados</div>
      </div>
      <input type="text" class="input-field" id="name-input" placeholder="Tu nombre (para tu diagnóstico)" maxlength="40" value="${state.userName||''}">
      <button class="btn-primary" id="start-btn">Comenzar diagnóstico</button>
    </div>
    <footer class="foot"><div id="secret-tap">${wordmark()}</div></footer>
  `;
}

function renderQuestion(){
  const q = QUESTIONS[state.current];
  const selected = state.answers[state.current];
  const pct = Math.round(((state.current)/QUESTIONS.length)*100);
  return `
    <header class="top">${wordmark()}</header>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="screen">
      <div class="q-count">Pregunta ${state.current+1} de ${QUESTIONS.length}</div>
      ${q.pillar!=='BOTTLENECK' ? `<div class="q-pillar">${q.pillar}</div>` : `<div class="q-pillar">DIAGNÓSTICO</div>`}
      <div class="q-text">${q.text}</div>
      <div class="options">
        ${q.options.map((o,i)=>`
          <div class="option ${selected===o.value?'selected':''}" data-idx="${i}">${o.label}</div>
        `).join('')}
      </div>
      <div class="nav-row">
        <button class="btn-secondary" id="back-btn" ${state.current===0?'disabled style="opacity:0.3;cursor:not-allowed;"':''}>Atrás</button>
        <button class="btn-primary" id="next-btn" ${selected===null?'disabled':''}>${state.current===QUESTIONS.length-1?'Ver diagnóstico':'Siguiente'}</button>
      </div>
    </div>
  `;
}

function renderLoading(){
  return `
    <header class="top">${wordmark()}</header>
    <div class="loading-screen">
      <div class="loading-title">Analizando tus respuestas</div>
      <div class="pulse-bar"></div>
      <div class="loading-sub">Calculando tu nivel y tu plan de acción...</div>
    </div>
  `;
}

function renderResult(){
  if(state.error){
    return `
      <header class="top">${wordmark()}</header>
      <div class="screen" style="justify-content:center;">
        <div class="error-box"><p>No se pudo generar el diagnóstico. ${state.error}</p></div>
        <button class="btn-primary" id="retry-btn">Reintentar</button>
      </div>
    `;
  }
  const r = state.result;
  const s = r.scores;
  const pillarLabels = {fundamentos:'Fundamentos', marca:'Marca personal', oferta:'Oferta y precios', ventas:'Ventas y retención'};
  return `
    <header class="top">${wordmark()}</header>
    <div class="screen">
      <div class="badge">Nivel: ${r.nivel}</div>
      <div class="score-row"><div class="score-num">${s.global}</div><div class="score-max">/ 100</div></div>
      <div class="score-label">Puntaje global hacia el modelo Coach Premium</div>

      <div class="pillars">
        ${Object.keys(pillarLabels).map(k=>`
          <div class="pillar-row">
            <div class="pillar-top"><span class="pillar-name">${pillarLabels[k]}</span><span class="pillar-val">${s[k]}</span></div>
            <div class="pillar-track"><div class="pillar-fill" style="width:${s[k]}%"></div></div>
          </div>
        `).join('')}
      </div>

      <div class="section-label">Diagnóstico</div>
      <div class="diagnostico-text">${r.diagnostico}</div>

      <div class="section-label">Tu brecha hacia Coach Premium</div>
      <div class="brecha-box"><p>${r.brecha}</p></div>

      <div class="section-label">Empieza por este módulo del taller</div>
      <div class="modulo-card">
        <div class="modulo-eyebrow">Módulo recomendado</div>
        <div class="modulo-name">${r.modulo_recomendado}</div>
        <div class="modulo-why">${r.por_que}</div>
      </div>

      <div class="section-label">Tus próximos 3 pasos</div>
      <ul class="steps">
        ${r.siguientes_pasos.map(p=>`<li><span class="step-text">${p}</span></li>`).join('')}
      </ul>

      <button class="btn-secondary" id="restart-btn">Repetir diagnóstico</button>
    </div>
    <footer class="foot">${wordmark()}</footer>
  `;
}

function renderPin(){
  return `
    <header class="top">${wordmark()}</header>
    <div class="screen" style="justify-content:center;">
      <div class="eyebrow">Panel coach</div>
      <h1 style="font-size:26px;">Ingresa<br><span class="accent">tu PIN</span></h1>
      <p class="sub">Acceso restringido al mentor del equipo.</p>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
        class="pin-input ${state.pinError?'pin-error':''}" id="pin-input" placeholder="••••" autofocus>
      ${state.pinError?'<div class="pin-error-text">PIN incorrecto. Intenta de nuevo.</div>':''}
      <button class="btn-primary" id="pin-submit" style="margin-bottom:12px;">Entrar</button>
      <button class="btn-secondary" id="pin-cancel">Cancelar</button>
    </div>
  `;
}

function renderCoach(){
  if(state.coachLoading){
    return `
      <header class="top">${wordmark()}</header>
      <div class="loading-screen">
        <div class="loading-title">Cargando panel</div>
        <div class="pulse-bar"></div>
        <div class="loading-sub">Trayendo diagnósticos del equipo...</div>
      </div>
    `;
  }
  const entries = state.coachData || [];
  const total = entries.length;
  const avgGlobal = total ? Math.round(entries.reduce((s,e)=>s+e.global,0)/total) : 0;
  const nivelCounts = {};
  entries.forEach(e=>{ nivelCounts[e.nivel]=(nivelCounts[e.nivel]||0)+1; });
  const bottleneckCounts = {};
  entries.forEach(e=>{ bottleneckCounts[e.bottleneck]=(bottleneckCounts[e.bottleneck]||0)+1; });
  const sorted = [...entries].sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));

  return `
    <header class="top">${wordmark()}<button class="btn-secondary coach-exit" id="coach-back">Salir</button></header>
    <div class="screen">
      <div class="eyebrow">Panel coach</div>
      <h1 style="font-size:26px;">Diagnósticos<br><span class="accent">del equipo</span></h1>
      <div class="meta-line">
        <div class="meta-item"><b>${total}</b>Completados</div>
        <div class="meta-item"><b>${avgGlobal}</b>Promedio global</div>
      </div>

      <div class="section-label">Distribución por nivel</div>
      <div class="pillars">
        ${total===0?'<p class="sub" style="margin-bottom:0;">Sin datos todavía.</p>':Object.keys(nivelCounts).map(n=>`
          <div class="pillar-row">
            <div class="pillar-top"><span class="pillar-name">${n}</span><span class="pillar-val">${nivelCounts[n]}</span></div>
            <div class="pillar-track"><div class="pillar-fill" style="width:${Math.round((nivelCounts[n]/total)*100)}%"></div></div>
          </div>
        `).join('')}
      </div>

      ${total>0?`
      <div class="section-label">Cuellos de botella más comunes</div>
      <div class="pillars">
        ${Object.keys(bottleneckCounts).sort((a,b)=>bottleneckCounts[b]-bottleneckCounts[a]).map(b=>`
          <div class="pillar-row">
            <div class="pillar-top"><span class="pillar-name">${b}</span><span class="pillar-val">${bottleneckCounts[b]}</span></div>
            <div class="pillar-track"><div class="pillar-fill" style="width:${Math.round((bottleneckCounts[b]/total)*100)}%"></div></div>
          </div>
        `).join('')}
      </div>

      <div class="section-label">Últimos diagnósticos</div>
      <ul class="coach-list">
        ${sorted.slice(0,25).map(e=>`
          <li class="coach-entry">
            <div class="coach-row"><span class="coach-name">${e.nombre}</span><span class="coach-score">${e.global}</span></div>
            <div class="coach-meta">${e.nivel} · ${new Date(e.fecha).toLocaleDateString('es-ES')} · ${e.bottleneck}</div>
          </li>
        `).join('')}
      </ul>

      <button class="btn-primary" id="export-drive-btn" style="margin-top:8px;">Descargar CSV para Drive</button>
      ${state.exportSent?'<p class="sub" style="margin-top:14px; margin-bottom:0;">Descarga lista. Súbelo a Google Drive o ábrelo directo con Google Sheets.</p>':''}
      `:''}
    </div>
  `;
}

function attachHandlers(){
  const startBtn = document.getElementById('start-btn');
  if(startBtn) startBtn.onclick = ()=>{
    const nameInput = document.getElementById('name-input');
    state.userName = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'Anónimo';
    state.screen='question'; state.current=0; render();
  };

  const secretTap = document.getElementById('secret-tap');
  if(secretTap) secretTap.onclick = handleSecretTap;

  const coachBack = document.getElementById('coach-back');
  if(coachBack) coachBack.onclick = ()=>{ state.screen='welcome'; render(); };

  const exportBtn = document.getElementById('export-drive-btn');
  if(exportBtn) exportBtn.onclick = exportToDrive;

  const pinSubmit = document.getElementById('pin-submit');
  if(pinSubmit) pinSubmit.onclick = checkPin;

  const pinCancel = document.getElementById('pin-cancel');
  if(pinCancel) pinCancel.onclick = ()=>{ state.screen='welcome'; state.pinError=false; render(); };

  const pinInput = document.getElementById('pin-input');
  if(pinInput){
    pinInput.focus();
    pinInput.onkeydown = (e)=>{ if(e.key==='Enter') checkPin(); };
  }

  const options = document.querySelectorAll('.option');
  options.forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.getAttribute('data-idx'));
      state.answers[state.current] = QUESTIONS[state.current].options[idx].value;
      render();
    };
  });

  const backBtn = document.getElementById('back-btn');
  if(backBtn) backBtn.onclick = ()=>{ if(state.current>0){ state.current--; render(); } };

  const nextBtn = document.getElementById('next-btn');
  if(nextBtn) nextBtn.onclick = ()=>{
    if(state.current < QUESTIONS.length-1){
      state.current++;
      render();
    } else {
      state.screen='loading';
      render();
      runDiagnostico();
    }
  };

  const retryBtn = document.getElementById('retry-btn');
  if(retryBtn) retryBtn.onclick = ()=>{ state.error=null; state.screen='loading'; render(); runDiagnostico(); };

  const restartBtn = document.getElementById('restart-btn');
  if(restartBtn) restartBtn.onclick = ()=>{
    state = { screen:'welcome', current:0, answers:new Array(QUESTIONS.length).fill(null), result:null, error:null, userName:'', coachData:null, coachLoading:false };
    render();
  };
}

function handleSecretTap(){
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>{ tapCount=0; }, 1500);
  if(tapCount>=5){
    tapCount=0;
    state.pinError=false;
    state.screen='pin';
    render();
  }
}

function recomendacionPara(global){
  if(global<40) return '1 a 1 (prioritario)';
  if(global<65) return '1 a 1';
  if(global<85) return 'Grupal';
  return 'Grupal / Embajador';
}

function csvEscape(val){
  const s = String(val==null?'':val);
  if(s.includes(',') || s.includes('"') || s.includes('\n')){
    return '"' + s.replace(/"/g,'""') + '"';
  }
  return s;
}

function exportToDrive(){
  const entries = state.coachData || [];
  const sorted = [...entries].sort((a,b)=> a.global - b.global);
  const header = ['Nombre','Fecha','Nivel','Puntaje Global','Fundamentos','Marca Personal','Oferta y Precios','Ventas y Retencion','Cuello de Botella','Recomendacion de Seguimiento'];
  const rows = sorted.map(e=>[
    e.nombre,
    new Date(e.fecha).toLocaleDateString('es-ES'),
    e.nivel,
    e.global,
    e.fundamentos,
    e.marca,
    e.oferta,
    e.ventas,
    e.bottleneck,
    recomendacionPara(e.global)
  ]);
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `JCOTRAINER-diagnosticos-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  state.exportSent = true;
  render();
}

function checkPin(){
  const pinInput = document.getElementById('pin-input');
  const value = pinInput ? pinInput.value.trim() : '';
  if(value === COACH_PIN){
    state.pinError = false;
    openCoachPanel();
  } else {
    state.pinError = true;
    render();
  }
}

async function openCoachPanel(){
  state.screen='coach';
  state.coachLoading=true;
  render();
  try{
    const res = await fetch('/api/registro');
    state.coachData = res.ok ? await res.json() : [];
  }catch(e){
    state.coachData = [];
  }
  state.coachLoading=false;
  render();
}

async function saveToRegistry(scores, bottleneck){
  try{
    await fetch('/api/registro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: state.userName || 'Anónimo',
        nivel: scores.nivel,
        global: scores.global,
        fundamentos: scores.fundamentos,
        marca: scores.marca,
        oferta: scores.oferta,
        ventas: scores.ventas,
        bottleneck: bottleneck,
        fecha: new Date().toISOString()
      })
    });
  }catch(e){
    console.error('No se pudo guardar el registro:', e);
  }
}

function computeScores(){
  const a = state.answers;
  const fundamentos = Math.round(((a[0]+a[1])/6)*100);
  const marca = Math.round(((a[2]+a[3])/6)*100);
  const oferta = Math.round(((a[4]+a[5])/6)*100);
  const ventas = Math.round(((a[6]+a[7])/6)*100);
  const global = Math.round((fundamentos+marca+oferta+ventas)/4);
  let nivel;
  if(global<40) nivel='Iniciado';
  else if(global<65) nivel='En desarrollo';
  else if(global<85) nivel='Cerca de Premium';
  else nivel='Coach Premium';
  return {fundamentos,marca,oferta,ventas,global,nivel};
}

async function runDiagnostico(){
  const scores = computeScores();
  const bottleneck = state.answers[8];

  try{
    const response = await fetch('/api/diagnostico', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scores, bottleneck })
    });

    if(!response.ok){
      throw new Error('Error de conexión con el servicio de análisis.');
    }

    const parsed = await response.json();
    if(parsed.error){
      throw new Error(parsed.error);
    }

    state.result = { scores, ...parsed };
    state.error = null;
    state.screen = 'result';
    render();
    saveToRegistry(scores, bottleneck);
  }catch(err){
    console.error("Diagnóstico error:", err);
    state.error = "Intenta de nuevo en unos segundos.";
    state.screen = 'result';
    render();
  }
}

render();
</script>
</body>
</html>
